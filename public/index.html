<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MOSS + Gemini team review</title><link rel="stylesheet" href="style.css"><style>
.eyebrow.dark{color:#246b59;margin-bottom:2px}.card-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-heading h3{margin:0}.gemini-only{border-top:3px solid #246b59;padding:16px;margin-top:14px}.gemini-only .hint{margin-top:4px}.segment-table-wrap{border:1px solid #d9dee7;border-radius:9px;overflow:auto;max-height:560px}.segment-table{display:table;width:100%;max-height:none;border:0;border-radius:0;overflow:visible}.segment-table thead,.segment-table tbody{display:table;width:100%;table-layout:fixed}.segment-table th{position:sticky;top:0;z-index:1}.segment-table th.time,.segment-table td.time{width:145px}.segment-table th.speaker,.segment-table td.speaker{width:90px}.segment-table th.edit-col,.segment-table td.edit-col{width:85px}.segment-table tr.revised{background:#fffaf0}.segment-table input,.segment-table textarea{width:100%;border:1px solid #cbd2dc;border-radius:5px;padding:6px;background:#fff;color:#1f2933;font:inherit}.segment-table textarea{min-height:66px;resize:vertical}.segment-table input:focus,.segment-table textarea:focus{outline:2px solid #b8ded2;border-color:#246b59}.time-link{border:0;background:transparent;color:#246b59;font:inherit;font-weight:700;padding:0;cursor:pointer}.inline-edit{display:flex;align-items:center;gap:3px;margin-top:6px}.inline-edit input{min-width:0;width:61px;font-size:11px;padding:4px}.save-row{border:0;border-radius:5px;padding:7px 8px;background:#246b59;color:#fff;font-size:11px;font-weight:700;cursor:pointer}.revision-mark{display:block;color:#b54708;font-size:10px;margin-top:5px}.original-text{margin-top:7px;padding:7px 8px;border-left:3px solid #e5a04b;background:#fff8ed;color:#6b4a27;font-size:12px;white-space:pre-wrap}.original-text span{display:block;color:#99651e;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.comment-panel{margin-top:14px;padding:16px;background:#fff;border:1px solid #d9dee7;border-radius:10px;box-shadow:0 8px 24px #1f29330d}.thread-list{display:grid;gap:9px}.empty-thread{padding:14px;border:1px dashed #cbd2dc;border-radius:7px;color:#667085}.comment{padding:12px;border:1px solid #d8e7e1;border-left:4px solid #246b59;border-radius:7px;background:#f8fcfa}.comment.resolved{border-left-color:#98a2b3;background:#f7f8fa;opacity:.78}.comment-head,.comment-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px}.comment-head span,.comment-foot{color:#667085}.comment p{margin:8px 0}.comment-foot button{border:0;background:transparent;color:#246b59;font-weight:700;cursor:pointer}.suggestion{padding:8px;background:#fff8ed;border-radius:5px;color:#6b4a27;white-space:pre-wrap}.suggestion span{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#99651e;letter-spacing:.08em}.new-comment{display:grid;gap:9px;margin-top:12px;padding-top:12px;border-top:1px solid #d9dee7}.new-comment button{justify-self:end;border:0;border-radius:7px;padding:9px 13px;background:#246b59;color:#fff;font-weight:700;cursor:pointer}
</style></head>
<body>
  <header class="topbar"><div><p class="eyebrow">TEAM ANNOTATION</p><h1>MOSS + Gemini 3.7 Flash</h1><p class="subtle">13 audio chunks · Gemini output is the source of truth</p></div><div class="toolbar"><label>Annotator <input id="annotator" placeholder="Your name"></label><button id="loadBtn" class="secondary">Load JSON / JSONL</button><button id="exportJsonBtn">Export JSON</button><button id="exportJsonlBtn" class="secondary">Export JSONL</button><input id="fileInput" type="file" accept=".json,.jsonl,application/json" hidden></div></header>
  <section class="summary" id="summary"></section>
  <main class="layout">
    <aside class="sidebar"><div class="filters"><input id="search" placeholder="Search chunk or transcript"><select id="statusFilter"><option value="all">All status</option><option value="unreviewed">Unreviewed</option><option value="reviewed">Reviewed</option><option value="issue">Has issue</option></select><select id="typeFilter"><option value="all">All issue types</option><option>ASR word error</option><option>Medical term</option><option>Missing content</option><option>Wrong timestamp</option><option>Wrong speaker</option><option>Other</option></select><select id="annotatorFilter"><option value="all">All annotators</option></select></div><div id="sampleList" class="sample-list"></div></aside>
    <section class="content"><div id="detail"></div></section>
  </main>
  <div id="toast" class="toast"></div><script src="app.js"></script>
</body></html>
