<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MOSS + Gemini team review</title><link rel="stylesheet" href="style.css"><style>
.eyebrow.dark{color:#246b59;margin-bottom:2px}.card-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-heading h3{margin:0}.layout.sidebar-collapsed{grid-template-columns:minmax(0,1fr)}.layout.sidebar-collapsed .sidebar{display:none}.review-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}.review-layout .comment-panel{position:sticky;top:14px;max-height:calc(100vh - 190px);overflow:auto}.gemini-only{border-top:3px solid #246b59;padding:16px;margin-top:14px}.gemini-only .hint{margin-top:4px}.segment-table-wrap{border:1px solid #d9dee7;border-radius:9px;overflow:auto;max-height:560px}.segment-table{display:table;width:100%;max-height:none;border:0;border-radius:0;overflow:visible}.segment-table thead,.segment-table tbody{display:table;width:100%;table-layout:fixed}.segment-table th{position:sticky;top:0;z-index:1}.segment-table th.time,.segment-table td.time{width:145px}.segment-table th.speaker,.segment-table td.speaker{width:90px}.segment-table th.edit-col,.segment-table td.edit-col{width:85px}.segment-table input,.segment-table textarea{width:100%;border:1px solid #cbd2dc;border-radius:5px;padding:6px;background:#fff;color:#1f2933;font:inherit}.segment-table input:focus,.segment-table textarea:focus{outline:2px solid #b8ded2;border-color:#246b59}.time-link{border:0;background:transparent;color:#246b59;font:inherit;font-weight:700;padding:0;cursor:pointer}.word-cell{line-height:2.2}.word-wrap{display:inline-block}.word-token{border:0;border-radius:4px;padding:2px 4px;background:transparent;color:#1f2933;font:inherit;cursor:pointer}.word-token:hover{background:#e4f2ed}.word-token.disagreed{background:#ffd8a8;color:#7a3d00;box-shadow:0 0 0 1px #e5a04b}.word-token.selected-word{outline:2px solid #246b59;outline-offset:1px}.word-token.corrected{border-bottom:2px solid #246b59}.corrected-label{font-size:11px;color:#246b59;font-weight:700;margin-left:2px}.optional{color:#667085;font-weight:400}.correction-box{padding:12px;background:#f4faf7;border:1px solid #cfe5dc;border-radius:8px;margin-bottom:12px}.selected-word-display{margin-bottom:9px;color:#246b59}.comment-panel{margin-top:14px;padding:16px;background:#fff;border:1px solid #d9dee7;border-radius:10px;box-shadow:0 8px 24px #1f29330d}.thread-list{display:grid;gap:9px}.review-comments{margin-top:18px;padding-top:14px;border-top:1px solid #d9dee7}.empty-thread{padding:14px;border:1px dashed #cbd2dc;border-radius:7px;color:#667085}.comment{padding:12px;border:1px solid #d8e7e1;border-left:4px solid #246b59;border-radius:7px;background:#f8fcfa}.comment.resolved{border-left-color:#98a2b3;background:#f7f8fa;opacity:.78}.comment-head,.comment-foot{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:12px}.comment-head span,.comment-foot{color:#667085}.comment p{margin:8px 0}.comment-foot button{border:0;background:transparent;color:#246b59;font-weight:700;cursor:pointer}.new-comment{display:grid;gap:9px;margin-top:12px;padding-top:12px;border-top:1px solid #d9dee7}.new-comment button,.actions button{justify-self:end;border:0;border-radius:7px;padding:9px 13px;background:#246b59;color:#fff;font-weight:700;cursor:pointer}.actions{display:flex;justify-content:flex-end;margin-top:10px}.actions button:disabled{background:#b8c2bd;cursor:not-allowed}
</style><style>.sidebar-toggle{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:20;border:1px solid #b8ded2;border-radius:0 8px 8px 0;padding:12px 8px;background:#173f35;color:#e0f2ed;font-weight:700;writing-mode:vertical-rl;cursor:pointer;box-shadow:0 4px 14px #1f293326}.sidebar-toggle:hover{background:#246b59}.action-label{margin-bottom:12px}.corrected-label{display:none}.word-token.corrected{border-bottom:0}.word-token.cannot-hear{background:#ffd6d6;color:#a11a1a;box-shadow:0 0 0 1px #d65c5c}.word-token.changed{background:#d9f1e5;color:#176b4d;box-shadow:0 0 0 1px #56a987}.word-token.deleted{text-decoration:line-through;color:#9b2c2c;background:#fde2e2;box-shadow:0 0 0 1px #d65c5c}</style><style>@media(max-width:760px){.review-layout{grid-template-columns:1fr}.review-layout .comment-panel{position:static;max-height:none}}</style></head>
<body>
  <header class="topbar"><div><p class="eyebrow">TEAM ANNOTATION</p><h1>MOSS + Gemini 3.7 Flash</h1><p class="subtle">13 audio chunks · flag “Cannot hear” and correct any word</p></div><div class="toolbar"><label>Annotator <input id="annotator" placeholder="Your name"></label><button id="loadBtn" class="secondary">Load JSON / JSONL</button><button id="exportJsonBtn">Export JSON</button><button id="exportJsonlBtn" class="secondary">Export JSONL</button><input id="fileInput" type="file" accept=".json,.jsonl,application/json" hidden></div></header>
  <section class="summary" id="summary"></section>
  <button id="toggleSidebar" class="sidebar-toggle" aria-expanded="true">Hide chunks</button><main class="layout"><aside class="sidebar"><div class="filters"><input id="search" placeholder="Search chunk or transcript"><select id="statusFilter"><option value="all">All status</option><option value="unreviewed">Unreviewed</option><option value="reviewed">Reviewed</option><option value="issue">Has issue</option></select><select id="typeFilter"><option value="all">All issue types</option><option>Cannot hear</option><option>ASR word disagreement</option><option>ASR word correction</option><option>ASR word deletion</option><option>Medical term</option><option>Missing content</option><option>Wrong timestamp</option><option>Wrong speaker</option><option>Other</option></select><select id="annotatorFilter"><option value="all">All annotators</option></select></div><div id="sampleList" class="sample-list"></div></aside><section class="content"><div id="detail"></div></section></main>
  <div id="toast" class="toast"></div><script src="app.js"></script>
</body></html>
